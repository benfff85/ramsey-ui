server:
  port: ${SERVER_PORT:8501}   # 8501 = drop-in replacement for the old Streamlit container port
  compression:
    enabled: true
    # The progression payload is ~1.1 MB of JSON (~9.7k stage points) and gzips ~9x —
    # the dominant load cost on mobile. Also covers the JS/CSS bundle and other JSON.
    mime-types: application/json,text/html,text/css,application/javascript,text/plain
    min-response-size: 1024
spring:
  application:
    name: ramsey-ui-rest
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
management:
  health:
    redis:
      enabled: false   # dashboard is read-only; Redis being down degrades data, not liveness
  endpoints:
    web:
      exposure:
        include: health,info
ramsey:
  api-base-url: ${API_BASE_URL:http://localhost:36000}
  sampler:
    interval-ms: 1000
  throughput:
    buffer-capacity: 21600  # shared across ACTIVE campaigns (samples are tagged); 3 campaigns x 2h @ 1/s
    default-window-seconds: 7200
